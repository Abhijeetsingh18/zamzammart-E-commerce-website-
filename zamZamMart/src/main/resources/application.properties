# Application Name & Port
spring.application.name=zamZamMart
server.port=8080

# Default Database: H2 in-memory (allows zero-config, immediate run)
spring.datasource.url=jdbc:h2:mem:zamzam_mart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=9a3f2c4e6b8a1d5f7e9c2b4a6d8f1e3c5b7a9d1f3e5c7a9b1d3f5e7c9a1b3d5e
app.jwt.expiration-ms=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------------------
# Gmail SMTP Configuration (@gmail.com)
# ----------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=zamzammart08@gmail.com
spring.mail.password=${MAIL_PASSWORD:abhijeet@7890}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# Frontend Base URL (for reset password links)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

